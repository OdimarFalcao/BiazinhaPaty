<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" shape-rendering="crispEdges">
  <style>
    .bob{animation:bob .8s steps(2,end) infinite;transform-origin:32px 41px}.hand-l{animation:scratch .48s steps(2,end) infinite;transform-origin:21px 35px}.hand-r{animation:mix .64s steps(2,end) infinite;transform-origin:43px 35px}.disc{animation:spin .72s steps(4,end) infinite;transform-box:fill-box;transform-origin:center}.disc.r{animation-direction:reverse}.bar{animation:eq .55s steps(3,end) infinite alternate;transform-box:fill-box;transform-origin:center bottom}.bar:nth-child(2){animation-delay:-.18s}.bar:nth-child(3){animation-delay:-.34s}.bar:nth-child(4){animation-delay:-.1s}.star{animation:blink .8s steps(2,end) infinite}.star.alt{animation-delay:-.4s}.wave{animation:slide 1.6s steps(4,end) infinite}@keyframes bob{50%{transform:translateY(-1px)}}@keyframes scratch{50%{transform:translate(2px,1px)}}@keyframes mix{50%{transform:translate(-1px,1px)}}@keyframes spin{to{transform:rotate(360deg)}}@keyframes eq{to{transform:scaleY(.25)}}@keyframes blink{50%{opacity:.15}}@keyframes slide{to{transform:translateX(4px)}}
  </style>
